[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:auth]
directory=/app/services/auth-service
command=uv run --locked --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8000
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:car]
directory=/app/services/car-service
command=uv run --locked --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8002
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:booking]
directory=/app/services/booking-service
command=uv run --locked --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8001
autostart=true
