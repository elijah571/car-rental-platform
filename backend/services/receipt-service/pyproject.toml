[project]
name = "car-rental-receipt-service"
version = "0.1.0"
description = "Immutable rental receipts and ticket snapshots for the Car Rental Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.147.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = ["aiosqlite>=0.22.1", "httpx>=0.28.1", "pytest>=9.1.1"]
