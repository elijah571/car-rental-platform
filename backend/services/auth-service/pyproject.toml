[project]
name = "car-rental-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "elijah571", email = "elijahfx43@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.147.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.11.0",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "PyJWT>=2.10.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
]
