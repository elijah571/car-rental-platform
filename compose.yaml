x-database-environment: &database-environment
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - car_rental_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - car_rental_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-environment
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-50m}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: ${AUTH_REDIS_URL:-redis://redis:6379/0}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      AUTH_ALLOW_DEV_VERIFICATION_CODE: ${AUTH_ALLOW_DEV_VERIFICATION_CODE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AUTH_SERVICE_API_KEY: ${AUTH_SERVICE_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  car-service:
    build:
      context: ./backend
      dockerfile: services/car-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-environment
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  booking-service:
    build:
      context: ./backend
      dockerfile: services/booking-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-environment
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CAR_SERVICE_URL: http://car-service:8002
      BOOKING_HOLD_MINUTES: 15
      PAYMENT_TO_BOOKING_API_KEY: ${PAYMENT_TO_BOOKING_API_KEY:-}
      PAYMENT_SERVICE_API_KEY: ${PAYMENT_SERVICE_API_KEY:-}
      PAYMENT_SERVICE_URL: http://payment-service:8004
      RECEIPT_SERVICE_URL: http://receipt-service:8005
      RECEIPT_SERVICE_API_KEY: ${RECEIPT_SERVICE_API_KEY:-}
      AUTH_SERVICE_URL: http://auth-service:8000
      AUTH_SERVICE_API_KEY: ${AUTH_SERVICE_API_KEY:-}
      NOTIFICATION_SERVICE_URL: http://notification-service:8003
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      RETURN_REMINDER_MINUTES: ${RETURN_REMINDER_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      car-service:
        condition: service_healthy
      receipt-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-environment
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY:-}
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-environment
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_SERVICE_API_KEY: ${PAYMENT_SERVICE_API_KEY:-}
      PAYMENT_TO_BOOKING_API_KEY: ${PAYMENT_TO_BOOKING_API_KEY:-}
      BOOKING_SERVICE_URL: http://booking-service:8001
      RECEIPT_SERVICE_API_KEY: ${RECEIPT_SERVICE_API_KEY:-}
      RECEIPT_SERVICE_URL: http://receipt-service:8005
      AUTH_SERVICE_API_KEY: ${AUTH_SERVICE_API_KEY:-}
      AUTH_SERVICE_URL: http://auth-service:8000
      NOTIFICATION_SERVICE_API_KEY: ${NOTIFICATION_SERVICE_API_KEY:-}
      NOTIFICATION_SERVICE_URL: http://notification-service:8003
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      receipt-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8004/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  receipt-service:
    build:
      context: ./backend
      dockerfile: services/receipt-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *database-environment
      RECEIPT_SERVICE_API_KEY: ${RECEIPT_SERVICE_API_KEY:-}
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8005/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  car_rental_postgres_data:
  car_rental_redis_data:
